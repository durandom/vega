[workspace]
resolver = "2"
members = ["crates/vega-secrets", "plugins/secrets", "plugins/notify", "plugins/orchestration", "shims/herdr", "shims/gh", "shims/tea", "crates/vega-shim", "crates/vega-build", "crates/vega-ci-watch", "crates/vega-bd-sync", "plugins/bd", "shims/bd", "plugins/ci", "vega", "crates/vega-herdr", "crates/vega-plugin", "crates/vega-transcript", "crates/vega-registry", "crates/vega-uber-msg", "plugins/skills", "plugins/mux", "plugins/post", "plugins/history", "plugins/open", "plugins/board", "plugins/deploy", "plugins/uac", "plugins/lanista", "plugins/capacity", "plugins/janitor", "plugins/review", "crates/vega-theme-sync", "crates/vega-schedule", "plugins/theme", "plugins/uber", "plugins/config", "plugins/onboard", "plugins/gate", "shims/git"]

# Local CLI tools: fat LTO with one codegen unit cost minutes per install for
# no felt speed-up (vega-919z). Default codegen units, no cross-crate LTO.
[profile.release]
opt-level = 3
lto = false
strip = true

# Line tables keep backtraces readable; full debuginfo made target/debug 36 GB
# and slowed every test link. Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
