[package]
name = "vega-bd-sync"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Beads sync: the provisioned projects, the bd runner and the sync cycle vegad runs, and git sync of the same projects (docs/design/beads-sync.md, git-sync.md)"
publish = false

[dependencies]
vega-herdr = { path = "../vega-herdr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
