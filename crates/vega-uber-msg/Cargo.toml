[package]
name = "vega-uber-msg"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Uber-UAC post messages: uber.* kinds, JSON bodies, size caps, ids and validation"
publish = false

[dependencies]
nuid = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"
