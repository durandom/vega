[package]
name = "vega-herdr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared herdr client and error contract for vega plugins"
publish = false

[dependencies]
base64 = "0.22"
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
toml_edit = { version = "0.25", features = ["serde"] }
url = "2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security", "Win32_System_IO"] }
