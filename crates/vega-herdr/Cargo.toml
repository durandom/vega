[package]
name = "vega-herdr"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared herdr client and error contract for vega plugins"
publish = false

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
regex = "1"
toml_edit = "0.25"
url = "2"
libc = "0.2"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
