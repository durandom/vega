[package]
name = "vega-ci-watch"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GitHub CI watch: targets, check buckets, conditional gh api requests and the poll cycle vegad runs"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vega-herdr = { path = "../vega-herdr" }

[dev-dependencies]
tempfile = "3"
