[package]
name = "vega-secrets"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Secrets for vega tools: manifest, per-host age identities, decrypt on demand (docs/design/secrets.md)"
publish = false

[dependencies]
age = "0.12"
toml_edit = "0.25"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
vega-herdr = { path = "../vega-herdr" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
