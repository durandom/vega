# Linux CI: the steps of `mise run check` (mise.toml [tasks.check]); keep both in sync.
# Rust comes from rust-toolchain.toml, nats-server from the mise [tools] pin: the
# vega post tests start a local broker. Tests that need live forges or an
# installed bd are #[ignore]d in the code and stay skipped here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 1

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: gitleaks
      - name: Scan full history (including PR history)
        run: gitleaks git --config .gitleaks.toml --log-opts=--all --redact --exit-code 1
      - name: Prove the scanner rejects a secret removed from HEAD
        run: sh scripts/gitleaks.test.sh
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: nats-server
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: cargo fmt
        run: nice cargo fmt --all --check
      - name: cargo clippy
        run: nice cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: nice cargo test --workspace
      - name: vscode tests
        working-directory: vscode
        run: node --test
      - name: shell tests
        run: |
          sh githooks/wt-guard.test.sh
          sh shims/activate.test.sh
          sh scripts/vegad-refresh.test.sh
          sh scripts/readmes.test.sh
          sh scripts/inline-md.test.sh
          python3 scripts/rustc-wrapper.test.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Local test broker
        shell: pwsh
        run: |
          $version = (Select-String -Path mise.toml -Pattern '^nats-server = "([^"]+)"').Matches[0].Groups[1].Value
          $archive = "nats-server-v$version-windows-amd64"
          Invoke-WebRequest "https://github.com/nats-io/nats-server/releases/download/v$version/$archive.zip" -OutFile "$env:RUNNER_TEMP/nats.zip"
          Expand-Archive "$env:RUNNER_TEMP/nats.zip" "$env:RUNNER_TEMP/nats"
          "$env:RUNNER_TEMP/nats/$archive" >> $env:GITHUB_PATH
      - name: Native client and mux target check
        run: |
          $packages = @()
          $manifest = Get-Content -Raw scripts/windows-packages.json | ConvertFrom-Json
          foreach ($package in $manifest) { $packages += @('-p', $package.package) }
          cargo check @packages --all-targets
      - name: Native client and mux target clippy
        run: |
          $packages = @()
          $manifest = Get-Content -Raw scripts/windows-packages.json | ConvertFrom-Json
          foreach ($package in $manifest) { $packages += @('-p', $package.package) }
          cargo clippy @packages --all-targets -- -D warnings
      - name: Native client and mux target tests
        timeout-minutes: 5
        run: |
          $packages = @()
          $manifest = Get-Content -Raw scripts/windows-packages.json | ConvertFrom-Json
          foreach ($package in $manifest) { $packages += @('-p', $package.package) }
          cargo test @packages
      - name: Remote starter mod tests (hc launch error envelopes)
        run: node --test --test-name-pattern="unprovisioned remote starters|missing sh starts|native starter accepts|Git sh" scripts/herdr-app-mods.test.mjs
      - name: PowerShell 5.1 source installer
        shell: powershell
        run: .\scripts\windows-install.ps1 -Checkout $PWD.Path -SkipUpdate
      - name: PowerShell 5.1 running worker update
        shell: powershell
        run: .\scripts\windows-replace.test.ps1
      - name: PowerShell 5.1 core autostart registration
        shell: powershell
        run: .\scripts\windows-core-autostart.test.ps1
