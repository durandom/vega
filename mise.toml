# Rust is pinned in rust-toolchain.toml (read by rustup); [tools] is for non-Rust toolchains.

# One target dir per checkout: a shared one (~/.cargo/config.toml) lets parallel
# sentinel worktrees overwrite each other's vega crates mid-build.
[env]
CARGO_TARGET_DIR = "{{config_root}}/target"
# sccache when installed ([tools]): worktrees share compiled dependencies.
RUSTC_WRAPPER = "{{config_root}}/scripts/rustc-wrapper.sh"
# Incremental only in the main checkout (.git is a directory): throwaway
# worktrees never reuse it, ~/.cargo/config.toml keeps it off for them.
CARGO_INCREMENTAL = "{% set git = config_root ~ '/.git' %}{% if git is dir %}1{% else %}0{% endif %}"

[tasks.build]
description = "Build all Rust crates (release)"
run = "cargo build --workspace --release"

[tasks.check]
description = "Format check, lint and test"
run = [
  "cargo fmt --all --check",
  # Catch socket client feature assumptions hidden by workspace feature unification.
  "cargo check -p vega-herdr",
  "cargo clippy --workspace --all-targets -- -D warnings",
  # nextest runs all test binaries in parallel (cargo test: one after another).
  # It skips doc tests; the workspace has none (doc code blocks are TOML).
  "cargo nextest run --workspace --status-level fail --final-status-level slow",
  "cd vscode && node --test",
  "sh githooks/wt-guard.test.sh",
  "sh shims/activate.test.sh",
  "sh scripts/vegad-refresh.test.sh",
  "sh scripts/readmes.test.sh",
  "sh scripts/inline-md.test.sh",
  "sh scripts/install-vscode-ext.test.sh",
  "sh scripts/check-stamp.test.sh",
  # Last: `mise run install` skips the check for this clean tree.
  "sh scripts/check-stamp.sh write",
]

[tasks.install-cli]
description = "Install the portable CLI part (vega, mux, deploy, lanista, shims, git hooks, skill link); also run by vega deploy"
run = "scripts/install-cli.sh"

[tasks.install]
description = "Install everything on this workstation: install-cli plus vega open and vega board (herdr plugins, VS Code extension)"
run = [
  # The check, unless it already passed on this clean tree (scripts/check-stamp.sh).
  "sh scripts/check-stamp.sh fresh && echo 'check: passed on this tree, skipped' >&2 || mise run check",
  # One release build, vega open and vega board included.
  "VEGA_INSTALL_EXTRA='vega-open vega-board' scripts/install-cli.sh",
  # herdr runs the open plugin from its own dir (./bin/vega-open), not from PATH;
  # the script only links from the main checkout, never from a worktree.
  "sh plugins/open/link-herdr.sh",
  # vega board likewise; the PATH copy serves `vega skills board`.
  "sh plugins/board/link-herdr.sh",
  # vega open's reveal/diff actions go through this extension's URI handler.
  "cd vscode && npm run -s package",
  # Skips with a hint where `code` is not on PATH (e.g. WSL).
  "sh scripts/install-vscode-ext.sh",
]

[tasks.nats]
description = "Run the local NATS JetStream broker for the vega mux broker spike (foreground)"
run = "nats-server -c spike/nats/nats.conf"

[tools]
# Public CI secret scanning; run separately from the developer check task.
gitleaks = "8.30.1"
# Broker spike: nats-server plus the `nats` CLI for inspection.
nats-server = "2.15.0"
"github:nats-io/natscli" = "0.5.0"
# Compiler cache behind scripts/rustc-wrapper.sh (RUSTC_WRAPPER above).
sccache = "0.19.0"
# Test runner for `mise run check`: runs all test binaries in parallel.
"github:nextest-rs/nextest" = "cargo-nextest-0.9.150"
