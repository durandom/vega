# Local spike broker for vega mux (docs/design/vega-mux-broker-spike.md).
# Loopback only; no auth. Data lives in .nats-data/ (gitignored).
server_name: vega-spike
listen: 127.0.0.1:4222
http: 127.0.0.1:8222

jetstream {
  store_dir: "./.nats-data"
  # Each host stream reserves its max_bytes (1 GiB) against this limit.
  max_file_store: 10G
  max_memory_store: 64M
}
