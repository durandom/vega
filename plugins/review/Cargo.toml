[package]
name = "vega-review"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Live review: the agent highlights elements in the owner's headed browser, the owner comments in-page, notes arrive as mail"
publish = false

[[bin]]
name = "vega-review"
path = "src/main.rs"

[dependencies]
vega-build = { path = "../../crates/vega-build" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
vega-herdr = { path = "../../crates/vega-herdr" }

[dev-dependencies]
tempfile = "3"
vega-plugin = { path = "../../crates/vega-plugin" }

[build-dependencies]
vega-build = { path = "../../crates/vega-build" }
