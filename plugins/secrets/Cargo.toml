[package]
name = "vega-secrets-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Secrets for tools and agents: inventory, env injection, set and rekey (docs/design/secrets.md)"
publish = false

[[bin]]
name = "vega-secrets"
path = "src/main.rs"

[dependencies]
vega-build = { path = "../../crates/vega-build" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
vega-secrets = { path = "../../crates/vega-secrets" }

[dev-dependencies]
vega-plugin = { path = "../../crates/vega-plugin" }
tempfile = "3"

[build-dependencies]
vega-build = { path = "../../crates/vega-build" }
