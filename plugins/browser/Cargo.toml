[package]
name = "vega-browser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Named agent-browser sessions: the global Chromium, throwaway fallbacks, owner records, list and cleanup"
publish = false

[lib]
name = "vega_browser"
path = "src/lib.rs"

[[bin]]
name = "vega-browser"
path = "src/main.rs"

[dependencies]
vega-build = { path = "../../crates/vega-build" }
vega-herdr = { path = "../../crates/vega-herdr" }
vega-shim = { path = "../../crates/vega-shim" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tungstenite = "0.28"
tempfile = "3"
base64 = "0.22"
libc = "0.2"
url = "2"
sha2 = "0.10"
subtle = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

ureq = { version = "2", features = ["json"] }

[dev-dependencies]
vega-plugin = { path = "../../crates/vega-plugin" }

[build-dependencies]
vega-build = { path = "../../crates/vega-build" }
