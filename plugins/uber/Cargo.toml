[package]
name = "vega-uber"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Uber-UAC: the Slayer's one channel to every UAC; estate-wide singleton claim"
publish = false

[[bin]]
name = "vega-uber"
path = "src/main.rs"

# The capture hook. Not `vega-*`: no plugin, so neither `vega uber ...`
# nor the `vega` dispatcher reaches it, and the Uber's allowlist
# (`Bash(vega uber:*)`) does not cover it (docs/design/uber-uac.md §4).
[[bin]]
name = "vega_uber_capture"
path = "src/capture_main.rs"

[dependencies]
vega-build = { path = "../../crates/vega-build" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
async-nats = "0.50"
vega-herdr = { path = "../../crates/vega-herdr" }
vega-registry = { path = "../../crates/vega-registry" }
vega-uber-msg = { path = "../../crates/vega-uber-msg" }
vega-plugin = { path = "../../crates/vega-plugin" }
vega-transcript = { path = "../../crates/vega-transcript" }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
vega-build = { path = "../../crates/vega-build" }
