[package]
name = "vega-history"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Read and export central event history with the viewer principal"
publish = false

[dependencies]
async-nats = "0.50"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
vega-herdr = { path = "../../crates/vega-herdr" }
vega-build = { path = "../../crates/vega-build" }

[dev-dependencies]
nkeys = "0.4"
vega-plugin = { path = "../../crates/vega-plugin" }
tempfile = "3"

[build-dependencies]
vega-build = { path = "../../crates/vega-build" }
