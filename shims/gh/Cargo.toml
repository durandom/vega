[package]
name = "gh-shim"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Agent-session shim for gh: passthrough, denies the watch loops, hints at vega ci, counts calls per pane"
publish = false

[[bin]]
name = "gh"
path = "src/main.rs"

[dependencies]
vega-shim = { path = "../../crates/vega-shim" }
